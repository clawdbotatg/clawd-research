<title>Square Fish Pond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed canvas pond, one floating scene switcher at the bottom, one caption at the top. */
:root {
  --ui-bg: rgba(14, 14, 20, .72);
  --ui-fg: #ece6dc;
  --ui-dim: #9b958c;
  --ui-on: #e8603a;
  --ui-line: rgba(255, 255, 255, .12);
  --pond: #16151c;
  --mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--pond); color: var(--ui-fg); font-family: var(--mono); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.cap {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; display: grid; gap: 4px; max-width: 46ch;
}
.cap b { font-weight: 600; font-size: 13px; letter-spacing: .04em; }
.cap span { font-size: 11px; color: var(--ui-dim); line-height: 1.5; }
.bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; gap: 2px; padding: 4px; border-radius: 10px;
  background: var(--ui-bg); border: 1px solid var(--ui-line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  max-width: calc(100vw - 32px);
}
.bar button {
  font: 600 11px/1 var(--mono); letter-spacing: .04em; color: var(--ui-dim);
  background: none; border: 0; padding: 10px 12px; white-space: nowrap; border-radius: 7px; cursor: pointer;
}
.bar button[aria-pressed="true"] { color: var(--ui-fg); background: rgba(255, 255, 255, .08); }
.bar button[aria-pressed="true"]::before { content: "■ "; color: var(--ui-on); }
.bar button:focus-visible { outline: 2px solid var(--ui-on); outline-offset: 1px; }
body.light { --ui-bg: rgba(250, 248, 243, .8); --ui-fg: #26222a; --ui-dim: #7a746c; --ui-line: rgba(0, 0, 0, .1); --pond: #f3f0e9; }
body.light .bar button[aria-pressed="true"] { background: rgba(0, 0, 0, .06); }
@media (max-width: 420px) { .bar button { padding: 10px 9px; font-size: 10px; } }
</style>

<canvas id="pond"></canvas>
<div class="cap"><b id="capName">Koi</b><span id="capNote"></span></div>
<nav class="bar" id="bar" aria-label="Scenes"></nav>

<script>
"use strict";
// ── math ─────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const adiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function hash(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), u = sstep(0, 1, x - xi), v = sstep(0, 1, y - yi);
  const a = hash(xi, yi, seed), b = hash(xi + 1, yi, seed), c = hash(xi, yi + 1, seed), d = hash(xi + 1, yi + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const css = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// ── body shapes, top-down, in fractions of body length ───────────────
// s runs 0 (snout) to 1 (tail tip); a is distance from the spine.
const SHAPES = {
  koi: {
    nodes: 18, bodyEnd: 0.8, tail: true, tailSize: 0.11, eye: [0.055, 0.1], wave: [0.035, 2.2],
    hw(s) {
      if (s < 0.14) return 0.1 * Math.pow(Math.sin((s / 0.14) * Math.PI / 2), 0.6);
      if (s < 0.32) return 0.1 + 0.02 * sstep(0.14, 0.32, s);
      return 0.04 + 0.08 * (1 - sstep(0.34, 0.8, s));
    },
    // pectoral and pelvic fins: root s, lean angle, reach, width
    fins: [[0.2, 0.9, 0.07, 0.04], [0.5, 0.75, 0.04, 0.02]],
  },
  goldfish: {
    nodes: 16, bodyEnd: 0.68, tail: true, eye: [0.07, 0.13], wave: [0.04, 1.8], tailSize: 0.15,
    hw(s) {
      if (s < 0.18) return 0.15 * Math.pow(Math.sin((s / 0.18) * Math.PI / 2), 0.55);
      return 0.05 + 0.1 * (1 - sstep(0.24, 0.68, s));
    },
    fins: [[0.25, 1.0, 0.08, 0.045], [0.45, 0.8, 0.05, 0.025]],
  },
  eel: {
    nodes: 26, bodyEnd: 1, tail: false, eye: [0.02, 0.04], wave: [0.07, 1.1], fringe: 0.02,
    hw(s) { return 0.042 * Math.pow(Math.sin(Math.min(s / 0.06, 1) * Math.PI / 2), 0.7) * (1 - 0.8 * s); },
    fins: [],
  },
};

const hit = { kind: 0, across: 1 };
// kind: 1 body, 2 fin, 3 eye
function classify(sh, s, a, flare) {
  const w = sh.hw(s);
  if (s <= sh.bodyEnd && a <= w) {
    hit.across = a / w;
    hit.kind = s > sh.eye[0] && s < sh.eye[1] && hit.across > 0.5 && hit.across < 0.8 ? 3 : 1;
    return true;
  }
  if (sh.tail && s > sh.bodyEnd - 0.06) {
    const t0 = sh.bodyEnd - 0.06;
    const tw = (0.03 + (sh.tailSize || 0.15) * Math.pow(sstep(t0, 1, s), 0.8)) * flare;
    // a V notch in the trailing edge
    if (a <= tw && s <= 0.86 + 0.14 * (a / tw)) { hit.kind = 2; return true; }
  }
  if (sh.fringe && s > 0.12 && a <= w + sh.fringe * (1 - s)) { hit.kind = 2; return true; }
  for (const [rs, ang, reach, wid] of sh.fins) {
    const r = reach * flare, du = s - rs, da = a - sh.hw(rs) * 0.85;
    const along = du * Math.cos(ang) + da * Math.sin(ang) - r;
    const perp = -du * Math.sin(ang) + da * Math.cos(ang);
    if ((along / r) ** 2 + (perp / wid) ** 2 <= 1) { hit.kind = 2; return true; }
  }
  return false;
}

// ── skins: a base colour plus markings pinned to body coordinates ────
function patches(f, P, variety) {
  const r = (j) => hash(f.id * 7 + 3, j, 41);
  const out = [];
  const saddles = (col, n) => {
    for (let j = 0; j < n; j++) {
      const span = 0.42 / n;
      out.push({ s: 0.25 + span * (j + 0.5) + (r(10 + j) - 0.5) * span * 0.3, v: (r(20 + j) - 0.5) * 0.05,
        rs: span * (0.32 + r(30 + j) * 0.14), rv: 0.08 + r(40 + j) * 0.05, col });
    }
  };
  const spots = (col, n, size) => {
    for (let j = 0; j < n; j++) out.push({ s: 0.2 + r(60 + j) * 0.45, v: (r(70 + j) - 0.5) * 0.15, rs: size, rv: size * 1.2, col });
  };
  switch (variety) {
    case "kohaku": if (r(0) < 0.75) out.push({ s: 0.1, v: 0, rs: 0.06 + r(2) * 0.03, rv: 0.11, col: P.red }); saddles(P.red, 2 + (r(3) * 2 | 0)); return { base: P.white, out };
    case "sanke": spots(P.black, 4 + (r(50) * 3 | 0), 0.022); saddles(P.red, 2 + (r(3) * 2 | 0)); return { base: P.white, out };
    case "tancho": out.push({ s: 0.1, v: 0, rs: 0.05, rv: 0.055, col: P.red }); return { base: P.white, out };
    case "showa": saddles(P.red, 3); spots(P.white, 3, 0.04); return { base: P.black, out };
    case "ogon": return { base: P.gold, out, metal: true };
    case "oranda": out.push({ s: 0.06, v: 0, rs: 0.07, rv: 0.12, col: P.red }); if (r(1) < 0.6) spots(P.white, 2, 0.06); return { base: P.orange, out };
    case "calico": spots(P.orange, 3, 0.07); spots(P.black, 5, 0.025); return { base: P.blue, out };
    case "comet": return { base: P.red, out };
    case "lemon": spots(P.white, 3, 0.05); return { base: P.gold, out };
    default: return { base: P.white, out };
  }
}
function skinAt(f, s, vn) {
  const wob = (noise(s * 14 + f.id, vn * 30, f.id + 3) - 0.5) * 0.6;
  let col = f.skin.base;
  for (const m of f.skin.out) if (((s - m.s) / m.rs) ** 2 + ((vn - m.v) / m.rv) ** 2 < 1 + wob) col = m.col;
  return col;
}

// ── scenes ───────────────────────────────────────────────────────────
const SCENES = {
  koi: {
    name: "Koi", note: "Square tiles with an etched glyph in each. Closest to daoho.dev. Tap to feed.",
    bg: [22, 21, 28], light: false, shape: "koi", cell: (W) => { const c = clamp(Math.round(W / 125), 8, 12); return [c, c + 2]; },
    varieties: ["kohaku", "kohaku", "sanke", "tancho", "showa", "ogon"],
    P: { white: [234, 226, 214], red: [226, 84, 48], black: [74, 72, 90], gold: [232, 178, 72], fin: [210, 202, 194],
      eye: [16, 16, 20], pellet: [236, 170, 92], water: [255, 247, 240], shadow: [0, 0, 0] },
    glyphs: " .:+x%#@", tileMix: [0.62, 0.98], ink: 0.45, alpha: 0.85, shadowA: 0.5,
  },
  mosaic: {
    name: "Mosaic", note: "Squares only, no letters. Shading snapped to four steps, like pixel art. Tap to feed.",
    bg: [9, 24, 32], light: false, shape: "goldfish", cell: (W) => { const c = W < 600 ? 10 : 14; return [c, c]; },
    varieties: ["oranda", "oranda", "calico", "comet", "lemon"],
    P: { white: [242, 238, 228], red: [232, 56, 42], black: [28, 32, 42], gold: [255, 200, 70], orange: [255, 128, 36], blue: [96, 132, 168],
      fin: [255, 190, 140], eye: [12, 14, 20], pellet: [255, 214, 120], water: [140, 220, 225], shadow: [0, 8, 12] },
    posterize: 4, alpha: 0.95, shadowA: 0.55, gap: 2, caustics: true,
  },
  paper: {
    name: "Paper", note: "Light mode. Pale washes of colour with dark ink glyphs on top. Tap to feed.",
    bg: [243, 240, 233], light: true, shape: "koi", cell: (W) => { const c = clamp(Math.round(W / 125), 8, 12); return [c, c + 2]; },
    varieties: ["kohaku", "sanke", "tancho", "kohaku", "showa"],
    P: { white: [150, 144, 138], red: [212, 66, 34], black: [40, 36, 44], gold: [214, 150, 50], fin: [150, 144, 138],
      eye: [30, 28, 32], pellet: [170, 100, 40], water: [60, 58, 56], shadow: [70, 66, 62], ink: [38, 34, 40] },
    glyphs: " .:+x%#@", tileMix: [0.32, 0.7], ink: 1, alpha: 0.95, shadowA: 0.16,
  },
  deep: {
    name: "Deep", note: "Letters only, glowing. Long eels with light spots in the dark. Tap to drop food.",
    bg: [4, 7, 16], light: false, shape: "eel", cell: () => [9, 13], count: (n) => clamp(n, 3, 5), lenScale: 1.5,
    varieties: ["c", "l", "m", "v"],
    P: { c: [70, 210, 255], l: [140, 255, 130], m: [255, 90, 200], v: [150, 130, 255], eye: [255, 255, 255],
      pellet: [255, 220, 130], water: [70, 150, 220] },
    glyphs: " .:-=+*#%@", glow: true, alpha: 0.9, plankton: 140,
  },
};

// ── world ────────────────────────────────────────────────────────────
const canvas = document.getElementById("pond");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1, cw = 10, ch = 12, cols = 0, rows = 0;
let scene = SCENES.koi;
let fish = [], pellets = [], ripples = [], bites = [], plankton = [];
let time = 0;
const pointer = { x: 0, y: 0, active: false, until: 0 };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function seed() {
  const sh = SHAPES[scene.shape];
  const base = clamp(Math.min(W, H) * 0.5, 150, 400) * (scene.lenScale || 1);
  let n = clamp(Math.round((W * H) / 240000), 3, 7);
  if (scene.count) n = scene.count(n);
  fish = []; pellets = []; ripples = []; bites = [];
  for (let i = 0; i < n; i++) {
    const L = base * rand(0.6, 1), heading = rand(0, TAU), x = rand(W * 0.15, W * 0.85), y = rand(H * 0.15, H * 0.85);
    const N = sh.nodes, nodes = new Float32Array(N * 2), seg = L / (N - 1);
    for (let k = 0; k < N; k++) { nodes[k * 2] = x - Math.cos(heading) * seg * k; nodes[k * 2 + 1] = y - Math.sin(heading) * seg * k; }
    const f = { id: i + 1, L, N, nodes, heading, speed: 20, phase: rand(0, TAU), finPhase: rand(0, TAU), beat: 0, turn: 0,
      wander: 0, burstUntil: 0, nextBurst: rand(0, 3), depth: rand(0.5, 1), depthT: rand(0.5, 1), nextDive: rand(6, 18),
      curiosity: rand(0.35, 1), food: null, rush: 0, nextWake: 0,
      variety: scene.varieties[(i + (Math.random() * scene.varieties.length | 0)) % scene.varieties.length] };
    f.skin = scene.shape === "eel" ? { base: scene.P[f.variety], out: [] } : patches(f, scene.P, f.variety);
    f.spine = new Float32Array(N * 2); f.arc = new Float32Array(N);
    fish.push(f);
  }
  plankton = [];
  for (let i = 0; i < (scene.plankton || 0); i++) plankton.push({ x: rand(0, W), y: rand(0, H), vx: rand(-4, 4), vy: rand(-3, 3), p: rand(0, TAU) });
}

function feed(x, y) {
  ripples.push({ x, y, born: time, str: 0.35 });
  const n = Math.min(6, 24 - pellets.length);
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 34;
    pellets.push({ x: x + Math.cos(a) * r * 1.3, y: y + Math.sin(a) * r, born: time, landAt: rand(0.15, 0.45), landed: false,
      vx: Math.cos(a) * rand(2, 6), vy: Math.sin(a) * rand(2, 6) });
  }
}

function step(dt) {
  time += dt;
  for (const f of fish) stepFish(f, dt);
  pellets = pellets.filter((p) => time - p.born < 14);
  for (const p of pellets) {
    if (!p.landed) {
      if (time - p.born < p.landAt) continue;
      p.landed = true; ripples.push({ x: p.x, y: p.y, born: time, str: 0.12 });
      for (const f of fish) if (Math.hypot(f.nodes[0] - p.x, f.nodes[1] - p.y) < 650) f.rush = 1;
      continue;
    }
    const damp = Math.exp(-dt * 0.2); p.vx *= damp; p.vy *= damp; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  ripples = ripples.filter((r) => time - r.born < 2.2 + r.str * 1.6);
  bites = bites.filter((b) => time - b.born < 0.45);
  for (const p of plankton) {
    p.x = (p.x + p.vx * dt + W) % W; p.y = (p.y + p.vy * dt + H) % H;
    for (const f of fish) { const dx = p.x - f.nodes[0], dy = p.y - f.nodes[1], d = Math.hypot(dx, dy); if (d < 60 && d > 1) { p.vx += dx / d * 40 * dt; p.vy += dy / d * 40 * dt; } }
    p.vx *= Math.exp(-dt * 0.5); p.vy *= Math.exp(-dt * 0.5);
  }
}

function stepFish(f, dt) {
  const L = f.L, nd = f.nodes, hx = nd[0], hy = nd[1];
  let dx = Math.cos(f.heading), dy = Math.sin(f.heading);
  f.wander = clamp(f.wander + (Math.random() - 0.5) * dt * 2.4, -0.9, 0.9);
  dx += Math.cos(f.heading + f.wander) * 0.6; dy += Math.sin(f.heading + f.wander) * 0.6;

  // food: stick with the current pellet unless a much closer one appears
  const range = Math.max(L * 1.6 + 220, f.rush > 0 ? 650 : 0);
  if (f.food && !pellets.includes(f.food)) f.food = null;
  let best = null, bd = range * range;
  for (const p of pellets) { if (!p.landed) continue; const d = (p.x - hx) ** 2 + (p.y - hy) ** 2; if (d < bd) { bd = d; best = p; } }
  if (!f.food || (best && Math.sqrt(bd) < Math.hypot(f.food.x - hx, f.food.y - hy) * 0.5)) f.food = best;

  let chasing = false, curious = false, closing = 0;
  if (f.food) {
    const tx = f.food.x - hx, ty = f.food.y - hy, d = Math.hypot(tx, ty) || 1;
    dx += tx / d * 3; dy += ty / d * 3; chasing = true; closing = clamp(1 - d / (L * 1.2), 0, 1);
  } else if (pointer.active) {
    const tx = pointer.x - hx, ty = pointer.y - hy, d = Math.hypot(tx, ty) || 1;
    if (d < 300) {
      // swim up, then circle under the cursor
      const w = f.curiosity * (1 - d / 300) * 2.2, near = clamp(d / (L * 0.6), 0, 1);
      dx += (tx / d * near - ty / d * (1 - near)) * w; dy += (ty / d * near + tx / d * (1 - near)) * w; curious = true;
    }
  }
  for (const o of fish) {
    if (o === f) continue;
    for (let k = 0; k < o.N; k += 3) {
      const ox = hx - o.nodes[k * 2], oy = hy - o.nodes[k * 2 + 1], d = Math.hypot(ox, oy), r = (L + o.L) * (chasing ? 0.12 : 0.28);
      if (d < r && d > 1e-3) { const w = (1 - d / r) * 2.4; dx += ox / d * w; dy += oy / d * w; }
    }
    if (!chasing && Math.hypot(o.nodes[0] - hx, o.nodes[1] - hy) < L * 1.6) { dx += Math.cos(o.heading) * 0.18; dy += Math.sin(o.heading) * 0.18; }
  }
  const over = Math.max(-hx, hx - W, -hy, hy - H);
  if (over > -L * 0.25) {
    const w = clamp((over + L * 0.25) / (L * 0.5), 0, 1) * 3.5, tx = W / 2 - hx, ty = H / 2 - hy, d = Math.hypot(tx, ty) || 1;
    dx += tx / d * w; dy += ty / d * w;
  }

  // long bodies turn wide
  const agility = (1 + f.rush * 0.6) * Math.min(chasing ? 1.9 + closing : curious ? 1.2 : 0.7, (f.speed / L) * 4);
  const turned = clamp(adiff(f.heading, Math.atan2(dy, dx)), -agility * dt, agility * dt);
  f.heading += turned; f.turn += (turned / dt - f.turn) * Math.min(1, dt * 3);

  // burst a few tail beats, then glide
  if (time > f.nextBurst && time > f.burstUntil) { f.burstUntil = time + rand(0.7, 1.6); f.nextBurst = f.burstUntil + rand(1.2, 4); }
  const bursting = chasing || time < f.burstUntil;
  f.beat += ((bursting ? 1 : 0) - f.beat) * Math.min(1, dt * 3);
  f.rush = Math.max(0, f.rush - dt * 0.7);
  const cruise = 12 + L * 0.05;
  const target = (1 + f.rush * 0.8) * (chasing ? cruise * (1.9 + closing) : bursting ? cruise * (curious ? 1.6 : 1.35) : cruise * 0.45);
  f.speed += (target - f.speed) * Math.min(1, dt * (bursting ? 1.6 + f.rush * 3 : 0.35));
  f.phase += dt * (0.6 + f.beat * (2.2 + f.speed / 11));
  f.finPhase += dt * 2.4;
  if (time > f.nextDive) { f.depthT = rand(0.5, 1); f.nextDive = time + rand(8, 20); }
  f.depth += ((chasing ? 1 : f.depthT) - f.depth) * Math.min(1, dt * (chasing ? 0.8 : 0.15));
  if (f.beat > 0.6 && f.depth > 0.7 && time > f.nextWake) {
    const t = (f.N - 3) * 2; ripples.push({ x: nd[t], y: nd[t + 1], born: time, str: 0.2 }); f.nextWake = time + rand(0.9, 1.8);
  }

  nd[0] += Math.cos(f.heading) * f.speed * dt; nd[1] += Math.sin(f.heading) * f.speed * dt;
  // each segment follows the one ahead, with a bend limit
  const seg = L / (f.N - 1); let prev = f.heading + Math.PI;
  for (let k = 1; k < f.N; k++) {
    const px = nd[(k - 1) * 2], py = nd[(k - 1) * 2 + 1];
    const a = prev + clamp(adiff(prev, Math.atan2(nd[k * 2 + 1] - py, nd[k * 2] - px)), -0.16, 0.16);
    nd[k * 2] = px + Math.cos(a) * seg; nd[k * 2 + 1] = py + Math.sin(a) * seg; prev = a;
  }
  const mouth = L * 0.08 + 6, before = pellets.length;
  pellets = pellets.filter((p) => !p.landed || (p.x - nd[0]) ** 2 + (p.y - nd[1]) ** 2 > mouth * mouth);
  if (pellets.length < before) { ripples.push({ x: nd[0], y: nd[1], born: time, str: 0.6 }); bites.push({ x: nd[0], y: nd[1], born: time }); }
}

// ── raster: sample every grid cell against each fish ─────────────────
const near = { s: 0, d: 0, side: 1, tx: 1, ty: 0, out: false };
function nearest(f, px, py) {
  const sp = f.spine, N = f.N; let best = Infinity;
  for (let n = 0; n < N - 1; n++) {
    const ax = sp[n * 2], ay = sp[n * 2 + 1], sx = sp[n * 2 + 2] - ax, sy = sp[n * 2 + 3] - ay;
    const l2 = sx * sx + sy * sy || 1, raw = ((px - ax) * sx + (py - ay) * sy) / l2, u = clamp(raw, 0, 1);
    const ex = px - ax - sx * u, ey = py - ay - sy * u, d2 = ex * ex + ey * ey;
    if (d2 < best) {
      const l = Math.sqrt(l2); best = d2;
      near.s = (f.arc[n] + u * l) / f.arc[N - 1];
      near.side = sx * (py - ay) - sy * (px - ax) >= 0 ? 1 : -1;
      near.tx = sx / l; near.ty = sy / l;
      near.out = (n === N - 2 && raw > 1) || (n === 0 && raw < 0);
    }
  }
  near.d = Math.sqrt(best);
}

function rasterize(f) {
  const sh = SHAPES[scene.shape], L = f.L, N = f.N, nd = f.nodes, sp = f.spine, swim = 0.2 + 1.1 * f.beat;
  // travelling wave that grows toward the tail
  for (let n = 0; n < N; n++) {
    const s = n / (N - 1), a = Math.max(0, n - 1), b = Math.min(N - 1, n + 1);
    let tx = nd[a * 2] - nd[b * 2], ty = nd[a * 2 + 1] - nd[b * 2 + 1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const off = L * sh.wave[0] * (0.05 + 0.95 * Math.pow(s, sh.wave[1])) * swim * Math.sin(f.phase - s * 4.6);
    sp[n * 2] = nd[n * 2] - ty * off; sp[n * 2 + 1] = nd[n * 2 + 1] + tx * off;
  }
  f.arc[0] = 0;
  for (let n = 1; n < N; n++) f.arc[n] = f.arc[n - 1] + Math.hypot(sp[n * 2] - sp[n * 2 - 2], sp[n * 2 + 1] - sp[n * 2 - 1]);
  const spread = 1 - 0.25 * f.beat, scull = 0.18 * (1 - f.beat) * Math.sin(f.finPhase), bank = clamp(f.turn * 0.6, -0.35, 0.35);
  const flareL = spread + scull - bank, flareR = spread - scull + bank;

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let n = 0; n < N; n++) { x0 = Math.min(x0, sp[n * 2]); x1 = Math.max(x1, sp[n * 2]); y0 = Math.min(y0, sp[n * 2 + 1]); y1 = Math.max(y1, sp[n * 2 + 1]); }
  const reach = L * 0.26, diag = Math.hypot(cw, ch), cells = [];
  const c0 = Math.max(0, Math.floor((x0 - reach) / cw)), c1 = Math.min(cols - 1, Math.floor((x1 + reach) / cw));
  const r0 = Math.max(0, Math.floor((y0 - reach) / ch)), r1 = Math.min(rows - 1, Math.floor((y1 + reach) / ch));
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const px = c * cw + cw / 2, py = r * ch + ch / 2;
      nearest(f, px, py);
      if (near.d > L * 0.26 + diag) { c += Math.max(0, Math.floor((near.d - L * 0.26 - diag) / cw)); continue; }
      if (near.out && near.s < 0.5) continue;
      const s = near.s, a = near.d / L;
      let kind, across = 1, edge = false;
      if (classify(sh, s, a, near.side > 0 ? flareL : flareR)) { kind = hit.kind; across = hit.across; }
      else if (s <= sh.bodyEnd && a - sh.hw(s) < (diag * 0.55) / L) { kind = 1; edge = true; }
      else continue;
      // light from the top-left across a rounded back
      const nx = -near.ty * near.side, ny = near.tx * near.side;
      const facing = -(nx * 0.6 + ny * 0.8) * across;
      const lum = clamp(0.22 + 0.55 * Math.sqrt(Math.max(0, 1 - across * across)) + 0.2 * facing, 0, 1);
      const vn = (near.d * near.side) / L;
      const key = (hash(Math.round(s * 90), Math.round((near.d * near.side) / (cw * 0.8)), f.id) * 4294967295) >>> 0;
      cells.push({ c, r, kind, edge, lum, s, vn, across, key, col: kind === 1 ? skinAt(f, s, vn) : null });
    }
  }
  return cells;
}

// ── drawing ──────────────────────────────────────────────────────────
function lineGlyph(dx, dy) {
  const d = Math.hypot(dx, dy) || 1;
  if (Math.abs(dy) < 0.38 * d) return "-";
  if (Math.abs(dx) < 0.38 * d) return "|";
  return dx * dy > 0 ? "\\" : "/";
}
function glyph(c, r, g, col, a) {
  ctx.globalAlpha = a; ctx.fillStyle = css(col); ctx.fillText(g, c * cw + cw / 2, r * ch + ch / 2 + 1);
}
function tile(c, r, col, a) {
  const g = scene.gap ?? 1;
  ctx.globalAlpha = a; ctx.fillStyle = css(col); ctx.fillRect(c * cw + g / 2, r * ch + g / 2, cw - g, ch - g);
}

function drawFishCells(f, cells) {
  const P = scene.P, bg = scene.bg, dim = scene.alpha * (0.45 + 0.55 * f.depth);
  for (const k of cells) {
    const { c, r } = k;
    if (scene.glow) { drawGlow(f, k, dim); continue; }
    if (k.kind === 3) { tile(c, r, mix(bg, P.eye, 0.9), dim); if (!scene.posterize) glyph(c, r, "o", mix(bg, P.white, 0.8), dim); continue; }
    if (k.kind === 2) {
      tile(c, r, mix(bg, P.fin, scene.posterize ? 0.45 : 0.5), dim * (scene.posterize ? 0.5 : 0.3));
      if (!scene.posterize && k.key % 2 === 0) glyph(c, r, ".", scene.light ? P.ink : P.fin, dim * 0.5);
      continue;
    }
    let lum = k.lum;
    if (scene.posterize) lum = Math.round(lum * (scene.posterize - 1)) / (scene.posterize - 1);
    let col;
    if (scene.posterize) {
      col = mix(mul(k.col, 0.45), k.col, 0.35 + 0.65 * lum);
      if (lum > 0.95 && k.key % 5 === 0) col = mix(col, [255, 255, 255], 0.35);
    } else if (k.col === P.red || f.skin.metal) {
      // red and gold run a hue ramp: deeper in shadow, warmer where lit, with a sheen band sliding down the body
      const sheen = Math.max(0, Math.sin(k.s * 11 - time * 1.8 + f.id) - 0.7) / 0.3;
      const lit = clamp(0.2 + 0.85 * lum + sheen * 0.3, 0, 1.2);
      col = mix(mix(bg, mul(k.col, 0.5), 0.9), mix(k.col, [255, 220, 150], 0.35), Math.min(1, lit));
      if (scene.light) col = mix(bg, col, scene.tileMix[0] + (scene.tileMix[1] - scene.tileMix[0]) * lum + 0.15);
    } else {
      col = mix(bg, k.col, scene.tileMix[0] + (scene.tileMix[1] - scene.tileMix[0]) * lum);
    }
    if (k.edge) { tile(c, r, col, dim * 0.4); continue; }
    // scales glint on a staggered clock
    if (hash(k.key, Math.floor(time * 1.4 + (k.key % 997) / 97), 7) < 0.03) col = mix(col, scene.light ? bg : [255, 255, 255], 0.3);
    tile(c, r, col, dim);
    if (scene.glyphs) {
      const G = scene.glyphs, j = (k.key >>> 4) % 3;
      const g = G[clamp(Math.round((1 - lum) * 4) + j + 1, 1, G.length - 1)];
      const ink = scene.light ? mix(P.ink, k.col, 0.35) : mul(col, scene.ink);
      glyph(c, r, g, ink, dim * (k.col === P.white && !scene.light ? 0.6 : scene.light ? 0.75 : 1));
    }
  }
}

function drawGlow(f, k, dim) {
  const P = scene.P, base = f.skin.base, G = scene.glyphs;
  if (k.kind === 3) { glyph(k.c, k.r, "o", P.eye, dim); return; }
  if (k.kind === 2) { if (k.key % 3 === 0) glyph(k.c, k.r, k.key % 2 ? "'" : ".", base, dim * 0.35); return; }
  // photophores: a pulsing row of light spots down each flank
  const spot = Math.abs(k.across - 0.55) < 0.22 && (k.s * 34 | 0) % 2 === 0 && k.s > 0.08 && k.s < 0.85;
  if (spot) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.4 - k.s * 18 + f.id);
    glyph(k.c, k.r, "*", mix(base, [255, 255, 255], 0.5), dim * (0.4 + 0.6 * pulse)); return;
  }
  const g = G[clamp(Math.round(k.lum * (G.length - 2)) + ((k.key >>> 4) % 2), 1, G.length - 1)];
  glyph(k.c, k.r, g, base, dim * (k.edge ? 0.25 : 0.35 + 0.5 * k.lum));
}

function drawRipples() {
  const P = scene.P;
  for (const rp of ripples) {
    const age = time - rp.born, life = 2.2 + rp.str * 1.6, fade = Math.pow(1 - age / life, 1.5) * rp.str;
    for (let ring = 0; ring < 2; ring++) {
      const radius = Math.max(0, age - ring * 0.45) * 52 * (0.7 + 0.5 * rp.str);
      if (radius < 2) continue;
      const band = cw * 0.6, a = fade * (ring === 0 ? 0.55 : 0.3);
      const c0 = Math.max(0, Math.floor((rp.x - radius - cw) / cw)), c1 = Math.min(cols - 1, Math.floor((rp.x + radius + cw) / cw));
      const r0 = Math.max(0, Math.floor((rp.y - radius - ch) / ch)), r1 = Math.min(rows - 1, Math.floor((rp.y + radius + ch) / ch));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const dx = c * cw + cw / 2 - rp.x, dy = r * ch + ch / 2 - rp.y;
        if (Math.abs(Math.hypot(dx, dy) - radius) > band) continue;
        if (scene.posterize) {
          ctx.globalAlpha = a * 0.6; ctx.strokeStyle = css(P.water); ctx.lineWidth = 1;
          ctx.strokeRect(c * cw + 2.5, r * ch + 2.5, cw - 5, ch - 5);
        } else glyph(c, r, ring === 1 ? "." : lineGlyph(-dy, dx), P.water, a);
      }
    }
  }
}

function drawPellets() {
  const P = scene.P;
  for (const p of pellets) {
    const age = time - p.born;
    const c = Math.floor(p.x / cw), r = Math.floor((p.landed ? p.y : p.y - (1 - age / p.landAt) * ch * 1.5) / ch);
    const sink = sstep(9, 14, age), bob = 0.8 + 0.2 * Math.sin(age * 3 + p.x), a = scene.alpha * bob * (1 - 0.85 * sink);
    if (scene.posterize) {
      const inset = p.landed ? 3 : 4;
      ctx.globalAlpha = p.landed ? a : 0.6; ctx.fillStyle = css(P.pellet); ctx.fillRect(c * cw + inset, r * ch + inset, cw - inset * 2, ch - inset * 2);
    } else glyph(c, r, !p.landed ? (age / p.landAt < 0.5 ? "'" : ".") : sink > 0.55 ? "." : scene.glow ? "*" : "o", P.pellet, p.landed ? a : 0.6);
  }
  for (const b of bites) {
    const t = (time - b.born) / 0.45;
    glyph(Math.floor(b.x / cw), Math.floor(b.y / ch), t < 0.35 ? "*" : t < 0.7 ? "+" : ".", P.pellet, Math.min(1, scene.alpha * 1.6) * (1 - t * t));
  }
}

function drawAmbient() {
  if (scene.caustics) {
    // faint grid of the whole pond, with slow light patterns moving through it
    ctx.fillStyle = css(scene.P.water);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const n = noise(c * 0.09 + time * 0.25, r * 0.09 - time * 0.18, 5) * noise(c * 0.13 - time * 0.2, r * 0.13 + time * 0.1, 9);
      ctx.globalAlpha = 0.02 + Math.max(0, n - 0.18) * 0.22;
      ctx.fillRect(c * cw + 1, r * ch + 1, cw - 2, ch - 2);
    }
  }
  if (scene.plankton) {
    for (const p of plankton) {
      const tw = 0.35 + 0.35 * Math.sin(time * 1.3 + p.p);
      glyph(Math.floor(p.x / cw), Math.floor(p.y / ch), p.p > 4 ? "·" : ".", scene.P.water, tw * 0.5);
    }
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = css(scene.bg); ctx.fillRect(0, 0, W, H);
  ctx.font = `600 ${Math.round(ch * 0.72)}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  drawAmbient();
  const sorted = [...fish].sort((a, b) => a.depth - b.depth);
  const rasters = sorted.map((f) => [f, rasterize(f)]);
  // shadows on the pond floor, farther off for fish near the surface
  if (scene.shadowA) {
    for (const [f, cells] of rasters) {
      const oc = Math.round((f.L * 0.07 * f.depth) / cw) + 1, or = Math.round((f.L * 0.05 * f.depth) / ch) + 1;
      for (const k of cells) if (k.kind === 1 && !k.edge) tile(k.c + oc, k.r + or, scene.P.shadow, scene.shadowA * 0.5);
    }
  }
  drawRipples();
  drawPellets();
  if (scene.glow) ctx.globalCompositeOperation = "lighter";
  for (const [f, cells] of rasters) drawFishCells(f, cells);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

// ── setup ────────────────────────────────────────────────────────────
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const first = W === 0;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  [cw, ch] = scene.cell(W); cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  if (first) seed();
}

const bar = document.getElementById("bar");
function setScene(key) {
  scene = SCENES[key] || SCENES.koi;
  document.body.classList.toggle("light", scene.light);
  document.getElementById("capName").textContent = scene.name;
  document.getElementById("capNote").textContent = scene.note;
  for (const b of bar.children) b.setAttribute("aria-pressed", String(b.dataset.k === key));
  [cw, ch] = scene.cell(W); cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  time = 0; seed();
  try { history.replaceState(null, "", "#" + key); } catch (e) {}
}
for (const k of Object.keys(SCENES)) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.k = k; b.textContent = SCENES[k].name;
  b.addEventListener("click", () => setScene(k));
  bar.appendChild(b);
}

canvas.addEventListener("pointermove", (e) => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; pointer.until = Infinity; });
canvas.addEventListener("pointerleave", () => { pointer.active = false; });
canvas.addEventListener("pointerdown", (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  if (e.pointerType !== "mouse") pointer.until = time + 3;
  feed(e.clientX, e.clientY);
});

addEventListener("resize", resize);
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (SCENES[k] && SCENES[k] !== scene) setScene(k); });
resize();
setScene(location.hash.slice(1));
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (reduced ? 0.4 : 1); last = now;
  if (pointer.active && time > pointer.until) pointer.active = false;
  step(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

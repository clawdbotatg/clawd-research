<script type="module">
import * as THREE from 'three';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FONT = new Font({"glyphs":{"0":{"ha":556,"x_min":0,"x_max":0,"o":"m 517 353 b 273 -9 517 73 417 -9 b 29 357 68 -9 29 159 b 273 724 29 561 70 724 b 517 353 481 724 517 554 m 377 356 b 273 611 377 576 342 611 b 169 358 198 611 169 564 b 273 111 169 147 202 111 b 377 356 348 111 377 157"},"1":{"ha":556,"x_min":0,"x_max":0,"o":"m 238 0 l 238 489 l 68 489 l 68 582 b 285 709 190 582 263 625 l 378 709 l 378 0"},"2":{"ha":556,"x_min":0,"x_max":0,"o":"m 515 499 b 356 259 515 403 479 349 b 212 125 252 183 230 163 l 512 125 l 512 0 l 30 0 b 194 276 37 131 74 194 b 375 496 350 387 375 418 b 275 610 375 567 337 610 b 174 485 211 610 174 564 l 174 462 l 40 462 b 39 487 39 473 39 481 b 272 724 39 637 125 724 b 515 499 421 724 515 636"},"3":{"ha":556,"x_min":0,"x_max":0,"o":"m 516 218 b 268 -9 516 80 419 -9 b 29 222 123 -9 29 80 l 165 222 b 271 111 165 149 205 111 b 376 218 332 111 376 156 b 217 324 376 294 322 324 l 217 418 l 229 418 b 353 518 312 418 353 447 b 265 611 353 577 321 611 b 168 486 196 611 168 574 l 38 486 l 38 498 b 268 724 38 652 131 724 b 493 531 405 724 493 649 b 400 387 493 466 466 428 b 516 218 480 348 516 301"},"4":{"ha":556,"x_min":0,"x_max":0,"o":"m 448 157 l 448 0 l 308 0 l 308 157 l 24 157 l 24 275 l 283 709 l 448 709 l 448 273 l 522 273 l 522 157 m 308 576 l 123 273 l 308 273"},"5":{"ha":556,"x_min":0,"x_max":0,"o":"m 517 241 b 261 -9 517 88 413 -9 b 27 199 123 -9 27 75 l 165 199 b 263 111 165 142 202 111 b 377 238 333 111 377 155 b 263 368 377 324 334 368 b 173 314 220 368 188 349 l 47 314 l 110 709 l 489 709 l 489 584 l 196 584 l 173 436 b 296 479 214 467 249 479 b 517 241 427 479 517 386"},"6":{"ha":556,"x_min":0,"x_max":0,"o":"m 519 244 b 282 -9 519 90 423 -9 b 83 89 198 -9 124 23 b 32 337 47 146 32 215 b 294 724 32 592 123 724 b 507 548 410 724 489 665 l 377 548 b 290 611 359 593 335 611 b 172 404 203 611 178 547 b 313 467 216 450 255 467 b 519 244 435 467 519 380 m 386 235 b 279 357 386 313 344 357 b 170 232 214 357 170 310 b 278 111 170 157 214 111 b 386 235 340 111 386 159"},"7":{"ha":556,"x_min":0,"x_max":0,"o":"m 528 599 b 274 0 360 396 287 224 l 133 0 b 226 347 151 151 178 244 b 382 584 255 409 339 538 l 29 584 l 29 709 l 528 709 l 528 599"},"8":{"ha":556,"x_min":0,"x_max":0,"o":"m 525 211 b 274 -9 525 77 422 -9 b 22 211 125 -9 22 77 b 138 386 22 295 56 342 b 46 531 74 420 46 463 b 274 724 46 643 142 724 b 501 532 405 724 501 643 b 409 386 501 462 472 420 b 525 211 491 342 525 295 m 380 518 b 275 611 379 573 338 611 b 169 519 212 611 169 573 b 275 425 169 464 213 425 b 380 518 336 425 380 464 m 385 217 b 273 330 385 291 342 330 b 162 219 206 330 162 291 b 273 111 162 149 205 111 b 385 217 341 111 385 149"},"9":{"ha":556,"x_min":0,"x_max":0,"o":"m 516 385 b 255 -9 516 134 433 -9 b 38 180 133 -9 41 71 l 173 180 b 259 111 176 138 210 111 b 376 313 338 111 376 178 b 240 243 327 258 303 243 b 28 482 114 243 28 336 b 267 724 28 630 125 724 b 516 385 412 724 516 633 m 373 482 b 263 610 373 565 331 610 b 161 484 201 610 161 566 b 265 359 161 403 201 359 b 373 482 329 359 373 404"}},"familyName":"TeXGyreHeros","ascender":1125,"descender":-307,"resolution":1000,"boundingBox":{"xMin":-531,"yMin":-307,"xMax":1359,"yMax":1125},"underlinePosition":0,"underlineThickness":0,"cssFontWeight":"normal","cssFontStyle":"normal"});

// ?at=19:45:40.3 starts the clock at that time; ?still freezes the camera (for frame comparisons)
const params = new URLSearchParams(location.search);
const STILL = params.has('still');
if (STILL) document.getElementById('credit').hidden = true;

// ---- sizes (world units; one floor tile = one second = 1) ----
const TILE = 1;
let CAP = 0.815;        // digit height on the floor
let PITCH = 0.385;      // tens-to-ones spacing
let NARROW = 0.635;        // horizontal squeeze
const RAISE = 0.15;     // digit thickness
const PIT = 0.15;  // as deep as a digit is thick: a dropped digit sits flush      // hole depth
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#bfb9a9');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 34, 60);

const camera = new THREE.PerspectiveCamera(8.4, innerWidth / innerHeight, 1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x9a9488, 2.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.01;
sun.shadow.radius = 10;
sun.shadow.blurSamples = 16;
scene.add(sun, sun.target);

// ---- concrete floor ----
function concreteTexture() {
  const N = 1024, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#c9c2af'; g.fillRect(0, 0, N, N);
  const blot = (x, y, r, a, col) => {
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    }
  };
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) blot(rnd() * N, rnd() * N, 120 + rnd() * 260, 0.06 + rnd() * 0.12, rnd() < 0.75 ? '120,112,96' : '235,230,220');
  const img = g.getImageData(0, 0, N, N), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 10;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  // pores
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = `rgba(120,108,88,${0.3 + rnd() * 0.4})`;
    g.beginPath(); g.arc(rnd() * N, rnd() * N, 0.8 + rnd() * 1.4, 0, 7); g.fill();
  }
  // seams: 4x4 tiles per texture
  g.strokeStyle = 'rgba(100,90,68,.85)'; g.lineWidth = 2.6;
  for (let i = 0; i <= 4; i++) {
    const p = i * N / 4;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, N); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(N, p); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floorTex = concreteTexture();
// ---- rolling mode: the floor is a drum turning under the clock ----
// Everything is laid out flat as before; the vertex shader wraps it around a cylinder
// whose axis runs along the readout (x) and whose top sits under the clock.
const ROLLING = true;
const DRUM_C = 48;                                   // circumference in tiles (a multiple of 4 keeps the texture seamless)
const BEND = { uBendR: { value: DRUM_C / (2 * Math.PI) }, uBendZ0: { value: 0 } };
const BEND_HEAD = `
uniform float uBendR; uniform float uBendZ0;
vec3 bendP(vec3 p) { float th = (p.z - uBendZ0) / uBendR, r = uBendR + p.y;
  return vec3(p.x, r * cos(th) - uBendR, uBendZ0 + r * sin(th)); }
vec3 bendN(vec3 p, vec3 n) { float th = (p.z - uBendZ0) / uBendR, c = cos(th), s = sin(th);
  return vec3(n.x, n.y * c - n.z * s, n.y * s + n.z * c); }
`;
function bendable(mat) {
  if (!ROLLING) return mat;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, BEND);
    sh.vertexShader = BEND_HEAD + sh.vertexShader
      .replace('#include <defaultnormal_vertex>', `
        vec3 bwp = (modelMatrix * vec4(position, 1.0)).xyz;
        vec3 transformedNormal = mat3(viewMatrix) * bendN(bwp, normalize(mat3(modelMatrix) * objectNormal));
        #ifdef FLIP_SIDED
          transformedNormal = -transformedNormal;
        #endif`)
      .replace('#include <project_vertex>', `
        vec4 bmv = modelMatrix * vec4(transformed, 1.0);
        bmv.xyz = bendP(bmv.xyz);
        vec4 mvPosition = viewMatrix * bmv;
        gl_Position = projectionMatrix * mvPosition;`)
      .replace('#include <worldpos_vertex>', `
        vec4 worldPosition = modelMatrix * vec4(transformed, 1.0);
        worldPosition.xyz = bendP(worldPosition.xyz);`);
  };
  mat.customProgramCacheKey = () => 'bend';
  return mat;
}
const BEND_DEPTH = bendable(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }));
const bendShadow = m => { if (ROLLING) m.customDepthMaterial = BEND_DEPTH; return m; };

const FLOOR = 120, FLOOR_L = ROLLING ? DRUM_C + 8 : FLOOR;
let SEAM = 1;                            // floor tile size (holes are one second = 1 apart)
const setSeam = s => { SEAM = s; floorTex.repeat.set(FLOOR / (SEAM * 4), FLOOR_L / (SEAM * 4)); };
setSeam(SEAM);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(FLOOR, FLOOR_L, 1, ROLLING ? 480 : 1),
  bendable(new THREE.MeshStandardMaterial({
    map: floorTex, roughness: 0.95, color: ROLLING ? 0x4a4744 : 0xffffff,
    // floor is skipped wherever a hole mask wrote 1 into the stencil
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc,
  }))
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floor.renderOrder = -1;
scene.add(floor);

// ---- digit geometry (cached per glyph) ----
const MASK_MAT = bendable(new THREE.MeshBasicMaterial({
  colorWrite: false, depthWrite: false, depthTest: false,
  stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
}));
const PIECE_MAT = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x3a3a3a, roughness: 0.8, vertexColors: true });
// tops stay white; sides are grey and darken toward the floor, like the original
const SIDE_TOP = 0.84, SIDE_BOTTOM = 0.42;
function shadeSides(geo) {
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3).fill(1);
  const sides = geo.groups.find(g => g.materialIndex === 1);
  if (sides) for (let i = sides.start; i < sides.start + sides.count; i++) {
    const u = Math.min(1, Math.max(0, 1 + pos.getZ(i) / RAISE)); // 0 at the floor, 1 at the top
    col.fill(SIDE_BOTTOM + (SIDE_TOP - SIDE_BOTTOM) * Math.sqrt(u), i * 3, i * 3 + 3); // dark contact band at the floor
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
// open-topped hole: floor + walls, seen from inside
const PIT_MAT = [
  bendable(new THREE.MeshStandardMaterial({ color: ROLLING ? 0x3a3733 : 0xaaa597, roughness: 1, side: THREE.BackSide })),                                // bottom
  bendable(new THREE.MeshStandardMaterial({ color: ROLLING ? 0x24221f : 0x8c877b, roughness: 1, side: THREE.BackSide, shadowSide: THREE.DoubleSide })), // walls
];

const GLYPH = {};
function buildGlyphs() {
const SIZE = CAP / (() => { const b = new THREE.ShapeGeometry(FONT.generateShapes('0', 1)); b.computeBoundingBox(); return b.boundingBox.max.y - b.boundingBox.min.y; })();
const capH = CAP;
for (let n = 0; n < 10; n++) {
  const ch = String(n);
  const shapes = FONT.generateShapes(ch, SIZE);
  const mask = new THREE.ShapeGeometry(shapes, 6);
  mask.computeBoundingBox();
  const cx = FONT.data.glyphs[ch].ha / FONT.data.resolution * SIZE / 2, cy = capH / 2; // centre of the digit's advance, like set type
  mask.translate(-cx, -cy, 0);

  const piece = new TextGeometry(ch, {
    font: FONT, size: SIZE, height: RAISE, depth: RAISE, curveSegments: 8,
    bevelEnabled: true, bevelThickness: 0.018, bevelSize: 0.014, bevelOffset: -0.014, bevelSegments: 2,
  });
  piece.computeBoundingBox();
  piece.translate(-cx, -cy, -piece.boundingBox.max.z); // top face at z = 0
  shadeSides(piece);

  const pit = new THREE.ExtrudeGeometry(shapes, { depth: PIT, bevelEnabled: false, curveSegments: 8 });
  pit.translate(-cx, -cy, -PIT);
  for (const g of [mask, piece, pit]) g.scale(NARROW, 1, 1);
  if (GLYPH[n]) for (const g of Object.values(GLYPH[n])) g.dispose();
  GLYPH[n] = { mask, piece, pit };
}
}
buildGlyphs();

// ---- the clock ----
// The clock stays put while the floor slides back under it, one tile per second.
// Each new digit appears a few tiles back, slides forward and catches up to the clock.
// The digit it replaces lets go at that moment: it rides away with the floor and
// sinks into the hole that was under it, so the past reads like a ruler: 48 9 50 1 2 …
const tz = () => new Date().getTimezoneOffset() * 60;
const LANES = [
  { P: 3600, value: k => k % 24 },
  { P: 60, value: k => k % 60 },
  { P: 1, value: k => k % 60 },
];
const FLY = 0.45, FLY_DIST = 3.1 * TILE; // catch-up slide, speeding up as it lands
let LEAD = 0.31;                         // the old digit drops this long before the new one lands…
const DROP = 0.15;                       // …straight down, the moment its hole is right under it
let CLOCK_Z = 4.2325;
let FLOOR_OFF = -0.0575;                      // tile seams relative to the holes
                    // where the clock sits on the floor
let Z_BACK = 12, Z_FRONT = 12;         // floor kept in the scene (world units)
// on the drum, keep to the side the camera can see: hole masks ignore depth, so one on the far side would cut through the near side
if (ROLLING) { Z_BACK = BEND.uBendR.value * 1.15; Z_FRONT = BEND.uBendR.value * 1.9; }

const clock = new THREE.Group();
scene.add(clock);
LANES.forEach((L, i) => {
  L.x = [-0.4274, 0.5526, 1.4637][i] * TILE; // lane centres, fitted to the original
  L.tens = k => Math.floor(L.value(k) / 10);
  L.tensEnds = k => L.tens(k + 1) !== L.tens(k); // tens digit leaves with this value
  L.objs = new Map();
});

const flat = () => { const g = new THREE.Group(); g.rotation.x = -Math.PI / 2; return g; };

function makeHole(L, k) {
  const g = flat();
  const add = (d, x) => {
    const m = new THREE.Mesh(GLYPH[d].mask, MASK_MAT); m.renderOrder = -2; m.position.x = x;
    const p = bendShadow(new THREE.Mesh(GLYPH[d].pit, PIT_MAT)); p.receiveShadow = p.castShadow = true; p.position.x = x;
    g.add(m, p);
  };
  add(L.value(k) % 10, PITCH / 2);
  if (L.tensEnds(k)) add(L.tens(k), -PITCH / 2);
  return g;
}

function makePiece(d, x) {
  const g = flat();
  const m = bendShadow(new THREE.Mesh(GLYPH[d].piece, bendable(PIECE_MAT.clone())));
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  g.mat = m.material;
  g.off = x;
  g.seed = (d * 7.31 + x * 13.7) % 100;
  return g;
}

const ease3 = u => 1 - (1 - u) ** 3;
const smooth = u => u * u * (3 - 2 * u);
const bumps = (f, s) => 0.5 * Math.sin(f * 2.3 + s) + 0.3 * Math.sin(f * 5.1 + s * 1.7) + 0.2 * Math.sin(f * 11.3 + s * 2.9);
// where a digit is at time t: sliding in, riding with the clock, or let go and sinking
function pieceState(t, arrive, leave) {
  if (t < arrive - FLY) return null;
  if (t < arrive) {
    const u = (t - (arrive - FLY)) / FLY;
    return { z: CLOCK_Z - FLY_DIST * (1 - u * u), y: RAISE, op: Math.min(1, u * 1.6), wob: 1 };
  }
  const drop = leave - LEAD;
  if (t < drop) return { z: CLOCK_Z, y: RAISE, op: 1, wob: 1 };
  // its hole is right under it: fall straight in, then ride away with the floor
  const w = Math.min(1, (t - drop) / DROP);
  return { z: CLOCK_Z - (t - drop) * TILE, y: RAISE * (1 - w * w), op: 1, wob: 1 - w };
}

function updateLane(L, t, Fc) {
  const P = L.P, kc = Math.floor(t / P);
  const Fh = k => (k + 1) * P - 1 - LEAD; // floor spot of value k's hole: under the clock when k drops
  const want = new Map();
  const put = (key, make, z, y, op, wob = 0) => {
    if (ROLLING && (z - CLOCK_Z < -Z_BACK || z - CLOCK_Z > Z_FRONT)) return; // off the visible arc of the drum
    let o = L.objs.get(key);
    if (!o) { o = make(); clock.add(o); L.objs.set(key, o); }
    o.position.set(L.x + (o.off || 0), y, z);
    if (o.mat) {
      o.mat.opacity = op; o.mat.transparent = op < 1;
      // rough floor: the digit rocks with the bumps passing under it
      const f = (Fc + (z - CLOCK_Z) / TILE) * 2.2, s = o.seed;
      const ax = 0.03 * wob * bumps(f, s), az = 0.03 * wob * bumps(f, s + 31), ay = 0.02 * wob * bumps(f * 0.7, s + 57);
      o.rotation.set(-Math.PI / 2 + ax, az, ay);
      o.position.y += wob * (0.004 * (bumps(f * 1.6, s + 83) + 1) + 0.25 * (Math.abs(ax) + Math.abs(az)));
    }
    want.set(key, o);
  };

  const kLo = Math.ceil((Fc - Z_BACK / TILE + 1 + LEAD) / P - 1);
  const kHi = Math.floor((Fc + Z_FRONT / TILE + 1 + LEAD) / P - 1);
  const ks = new Set();
  for (let k = kLo; k <= kHi; k++) {
    ks.add(k);
    put('h' + k, () => makeHole(L, k), CLOCK_Z + (Fh(k) - Fc) * TILE, 0, 1);
  }
  for (let k = kc - 1; k <= kc + 1; k++) ks.add(k);
  // the tens digit on show belongs to the last value of its run
  let end = kc; while (!L.tensEnds(end)) end++;
  ks.add(end); ks.add(end + 1);

  for (const k of ks) {
    const leave = (k + 1) * P;
    const s = pieceState(t, k * P, leave);
    if (s) put('o' + k, () => makePiece(L.value(k) % 10, PITCH / 2), s.z, s.y, s.op, s.wob);
    if (L.tensEnds(k)) {
      let start = k; while (!L.tensEnds(start - 1)) start--;
      const st = pieceState(t, start * P, leave);
      if (st) put('t' + k, () => makePiece(L.tens(k), -PITCH / 2), st.z, st.y, st.op, st.wob);
    }
  }
  for (const [key, o] of L.objs) {
    if (want.has(key)) continue;
    clock.remove(o); o.mat?.dispose(); L.objs.delete(key);
  }
}

// ---- camera (fitted to the original: long lens, slight roll) ----
// fitted by matching edge maps against frames of the original
const target = new THREE.Vector3(0.576, 0, 4.15);
let ROLL = -0.3265;
camera.position.set(-5.4855, 10.5945, 21.6485);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(target);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 40;
controls.maxPolarAngle = 1.2;
controls.enabled = !STILL;
controls.update();
let lastTouch = -1e9;
controls.addEventListener('start', () => (lastTouch = performance.now()));
controls.addEventListener('end', () => (lastTouch = performance.now()));

let FOV = 7.4525;
function fitFov() {
  camera.aspect = innerWidth / innerHeight;
  // keep the whole readout on narrow screens
  camera.fov = camera.aspect < 1 ? FOV / Math.max(camera.aspect, 0.5) ** 0.85 : FOV;
  camera.updateProjectionMatrix();
}
fitFov();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitFov(); });

// ---- time ----
const realNow = () => Date.now() / 1000 - tz();   // local seconds since epoch
let offset = 0;
const at = params.get('at');
if (at) {
  const [h, m, s] = at.split(':').map(Number);
  const day = Math.floor(realNow() / 86400) * 86400;
  offset = day + h * 3600 + m * 60 + s - realNow();
}

function draw(t) {
  const Fc = t - 1; // floor spot under the clock, in seconds
  const fz = CLOCK_Z - LEAD + 0.5 * SEAM - Fc + FLOOR_OFF; // tile seams sit half a tile from each hole
  floor.position.z = fz - Math.floor(fz / (4 * SEAM)) * 4 * SEAM;
  for (const L of LANES) updateLane(L, t, Fc);
  BEND.uBendZ0.value = CLOCK_Z;
  sun.position.copy(target).add(new THREE.Vector3(-4, 12, 3));
  sun.target.position.copy(target);
  camera.rotateZ(ROLL);
  renderer.render(scene, camera);
  camera.rotateZ(-ROLL);
}

// for frame-by-frame checks: render one frame at a time of day, in seconds
let frozen = false;
window.clockAt = sod => {
  frozen = true;
  const day = Math.floor(realNow() / 86400) * 86400;
  draw(day + sod);
  return renderer.domElement;
};
window.setParams = p => {
  if (p.cam) camera.position.set(...p.cam);
  if (p.tgt) { target.set(...p.tgt); controls.target.copy(target); }
  if (p.fov) { FOV = p.fov; fitFov(); }
  if (p.roll != null) ROLL = p.roll;
  if (p.lanes) LANES.forEach((L, i) => (L.x = p.lanes[i]));
  if (p.clockZ != null) CLOCK_Z = p.clockZ;
  if (p.floorOff != null) FLOOR_OFF = p.floorOff;
  if (p.seam) setSeam(p.seam);
  if (p.lead != null) { LEAD = p.lead; for (const L of LANES) { for (const o of L.objs.values()) clock.remove(o); L.objs.clear(); } }
  if (p.cap || p.narrow || p.pitch) {
    if (p.cap) CAP = p.cap; if (p.narrow) NARROW = p.narrow; if (p.pitch) PITCH = p.pitch;
    buildGlyphs();
    for (const L of LANES) { for (const o of L.objs.values()) clock.remove(o); L.objs.clear(); }
  }
  camera.up.set(0, 1, 0); camera.lookAt(target);
};
window.__three = { scene, renderer, camera };
window.__dbg = () => ({ pos: camera.position.toArray(), quat: camera.quaternion.toArray(), fov: camera.fov, aspect: camera.aspect, size: [renderer.domElement.width, renderer.domElement.height], CAP, NARROW, PITCH, ROLL });
// the drum: black room, dark drum, camera square in front so the time reads upright
if (ROLLING) {
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x000000, 17, 30);
  document.documentElement.style.setProperty('--bg', '#000');
  document.documentElement.style.setProperty('--ink', '#8a857a');
  target.set(0.53, 0, CLOCK_Z);
  camera.position.set(0.53, 11.5, CLOCK_Z + 11);
  controls.target.copy(target);
  ROLL = 0; FOV = 19; fitFov();
  target.z = CLOCK_Z - 0.6; controls.target.copy(target); // aim a touch behind the clock so the drum's edge shows
}
setParams({}); // aim the camera now, not on the first animation frame
window.setCam = (pos, tgt, fov) => {
  target.set(...tgt); controls.target.copy(target);
  camera.position.set(...pos).add(target);
  if (fov) { FOV = fov; fitFov(); }
  camera.lookAt(target);
};

const swayBase = camera.position.clone().sub(target);
function frame(now) {
  requestAnimationFrame(frame);
  if (frozen) return;
  if (!STILL && !reduced && now - lastTouch > 4000) {
    const s = now / 1000;
    const want = swayBase.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(s * 0.07) * 0.18).add(target);
    want.y += Math.sin(s * 0.11) * 0.4;
    camera.position.lerp(want, 0.004);
  }
  controls.update();
  draw(realNow() + offset);
}
requestAnimationFrame(frame);
</script>

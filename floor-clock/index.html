<script type="module">
import * as THREE from 'three';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FONT = new Font({"glyphs":{"0":{"ha":556,"x_min":0,"x_max":0,"o":"m 507 341 b 275 -15 507 108 425 -15 b 43 347 123 -15 43 108 b 275 709 43 585 122 709 b 507 341 429 709 507 587 m 417 349 b 275 631 417 539 370 631 b 133 346 180 631 133 540 b 273 58 133 152 180 58 b 417 349 371 58 417 148"},"1":{"ha":556,"x_min":0,"x_max":0,"o":"m 259 0 l 259 505 l 102 505 l 102 568 b 289 709 238 585 258 600 l 347 709 l 347 0"},"2":{"ha":556,"x_min":0,"x_max":0,"o":"m 511 501 b 361 287 511 414 460 340 l 261 233 b 133 87 174 182 142 145 l 506 87 l 506 0 l 34 0 b 233 307 42 156 85 223 l 325 359 b 421 499 388 395 421 443 b 281 632 421 575 361 632 b 138 463 194 632 145 582 l 50 463 b 284 709 55 635 139 709 b 511 501 418 709 511 621"},"3":{"ha":556,"x_min":0,"x_max":0,"o":"m 506 206 b 266 -15 506 72 412 -15 b 32 214 121 -15 43 56 l 120 214 b 269 63 126 111 173 63 b 416 205 361 63 416 116 b 269 330 416 284 366 330 l 221 330 l 221 404 b 395 511 362 404 395 435 b 270 632 395 586 348 632 b 135 480 180 632 137 585 l 47 480 b 269 709 50 631 126 709 b 485 514 404 709 485 636 b 386 371 485 443 452 397 b 506 206 471 342 506 292"},"4":{"ha":556,"x_min":0,"x_max":0,"o":"m 415 170 l 415 0 l 327 0 l 327 170 l 28 170 l 28 263 l 350 709 l 415 709 l 415 249 l 520 249 l 520 170 m 327 559 l 105 249 l 327 249"},"5":{"ha":556,"x_min":0,"x_max":0,"o":"m 513 235 b 270 -15 513 85 413 -15 b 35 182 144 -15 64 41 l 123 182 b 268 63 144 102 191 63 b 423 223 364 63 423 121 b 268 389 423 328 363 389 b 138 323 213 389 179 372 l 57 323 l 110 694 l 476 694 l 476 607 l 181 607 l 153 424 b 284 467 194 454 234 467 b 513 235 420 467 513 375"},"6":{"ha":556,"x_min":0,"x_max":0,"o":"m 513 220 b 281 -15 513 81 416 -15 b 43 323 119 -15 43 102 b 297 709 43 570 132 709 b 498 524 405 709 481 640 l 410 524 b 291 631 396 592 353 631 b 133 362 190 631 134 535 b 296 441 171 414 226 441 b 513 220 423 441 513 352 m 423 213 b 285 363 423 308 370 363 b 138 218 198 363 138 306 b 282 63 138 127 200 63 b 423 213 363 63 423 124"},"7":{"ha":556,"x_min":0,"x_max":0,"o":"m 520 620 b 232 0 371 443 271 229 l 138 0 b 429 607 188 222 288 429 l 46 607 l 46 694 l 520 694 l 520 620"},"8":{"ha":556,"x_min":0,"x_max":0,"o":"m 513 200 b 275 -15 513 71 415 -15 b 37 201 135 -15 37 71 b 158 373 37 279 77 334 b 62 520 86 418 62 454 b 275 709 62 631 150 709 b 488 520 401 709 488 631 b 391 373 488 453 464 417 b 513 200 473 334 513 279 m 398 518 b 275 631 398 587 350 631 b 152 519 201 631 152 587 b 275 408 152 452 201 408 b 398 518 349 408 398 452 m 423 199 b 275 334 423 282 363 334 b 127 199 187 334 127 282 b 273 63 127 116 187 63 b 423 199 363 63 423 115"},"9":{"ha":556,"x_min":0,"x_max":0,"o":"m 509 371 b 254 -15 509 126 420 -15 b 53 170 146 -15 70 54 l 141 170 b 260 63 155 102 198 63 b 418 332 361 63 417 159 b 256 253 372 277 323 253 b 38 474 128 253 38 342 b 270 709 38 613 135 709 b 509 371 432 709 509 593 m 413 476 b 269 632 413 568 351 632 b 128 481 188 632 128 571 b 266 331 128 386 181 331 b 413 476 352 331 413 389"}},"familyName":"TeXGyreHeros","ascender":1148,"descender":-284,"resolution":1000,"boundingBox":{"xMin":-529,"yMin":-284,"xMax":1353,"yMax":1148},"underlinePosition":0,"underlineThickness":0,"cssFontWeight":"normal","cssFontStyle":"normal"});

// ?at=19:45:40.3 starts the clock at that time; ?still freezes the camera (for frame comparisons)
const params = new URLSearchParams(location.search);
const STILL = params.has('still');
if (STILL) document.getElementById('credit').hidden = true;

// ---- sizes (world units; one floor tile = one second = 1) ----
const TILE = 1;
let CAP = 0.86;         // digit height on the floor
let PITCH = 0.38;      // tens-to-ones spacing
let NARROW = 0.635;        // horizontal squeeze
const RAISE = 0.12;     // digit thickness
const PIT = 0.12;  // as deep as a digit is thick: a dropped digit sits flush      // hole depth
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#bfb9a9');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 34, 60);

const camera = new THREE.PerspectiveCamera(8.4, innerWidth / innerHeight, 1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x9a9488, 2.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.01;
sun.shadow.radius = 10;
sun.shadow.blurSamples = 16;
scene.add(sun, sun.target);

// ---- concrete floor ----
function concreteTexture() {
  const N = 1024, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#c9c2af'; g.fillRect(0, 0, N, N);
  const blot = (x, y, r, a, col) => {
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    }
  };
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) blot(rnd() * N, rnd() * N, 120 + rnd() * 260, 0.06 + rnd() * 0.12, rnd() < 0.75 ? '120,112,96' : '235,230,220');
  const img = g.getImageData(0, 0, N, N), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 10;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  // pores
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = `rgba(120,108,88,${0.3 + rnd() * 0.4})`;
    g.beginPath(); g.arc(rnd() * N, rnd() * N, 0.8 + rnd() * 1.4, 0, 7); g.fill();
  }
  // seams: 4x4 tiles per texture
  g.strokeStyle = 'rgba(100,90,68,.85)'; g.lineWidth = 2.6;
  for (let i = 0; i <= 4; i++) {
    const p = i * N / 4;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, N); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(N, p); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floorTex = concreteTexture();
const FLOOR = 120;
let SEAM = 1;                            // floor tile size (holes are one second = 1 apart)
const setSeam = s => { SEAM = s; floorTex.repeat.set(FLOOR / (SEAM * 4), FLOOR / (SEAM * 4)); };
setSeam(SEAM);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(FLOOR, FLOOR),
  new THREE.MeshStandardMaterial({
    map: floorTex, roughness: 0.95,
    // floor is skipped wherever a hole mask wrote 1 into the stencil
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc,
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floor.renderOrder = -1;
scene.add(floor);

// ---- digit geometry (cached per glyph) ----
const MASK_MAT = new THREE.MeshBasicMaterial({
  colorWrite: false, depthWrite: false, depthTest: false,
  stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
});
const PIECE_MAT = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x3a3a3a, roughness: 0.8 });
// open-topped hole: floor + walls, seen from inside
const PIT_MAT = [
  new THREE.MeshStandardMaterial({ color: 0xaaa597, roughness: 1, side: THREE.BackSide }),                                // bottom
  new THREE.MeshStandardMaterial({ color: 0x8c877b, roughness: 1, side: THREE.BackSide, shadowSide: THREE.DoubleSide }), // walls
];

const GLYPH = {};
function buildGlyphs() {
const SIZE = CAP / (() => { const b = new THREE.ShapeGeometry(FONT.generateShapes('0', 1)); b.computeBoundingBox(); return b.boundingBox.max.y - b.boundingBox.min.y; })();
const capH = CAP;
for (let n = 0; n < 10; n++) {
  const ch = String(n);
  const shapes = FONT.generateShapes(ch, SIZE);
  const mask = new THREE.ShapeGeometry(shapes, 6);
  mask.computeBoundingBox();
  const cx = FONT.data.glyphs[ch].ha / FONT.data.resolution * SIZE / 2, cy = capH / 2; // centre of the digit's advance, like set type
  mask.translate(-cx, -cy, 0);

  const piece = new TextGeometry(ch, {
    font: FONT, size: SIZE, height: RAISE, depth: RAISE, curveSegments: 8,
    bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.008, bevelOffset: -0.008, bevelSegments: 2,
  });
  piece.computeBoundingBox();
  piece.translate(-cx, -cy, -piece.boundingBox.max.z); // top face at z = 0

  const pit = new THREE.ExtrudeGeometry(shapes, { depth: PIT, bevelEnabled: false, curveSegments: 8 });
  pit.translate(-cx, -cy, -PIT);
  for (const g of [mask, piece, pit]) g.scale(NARROW, 1, 1);
  if (GLYPH[n]) for (const g of Object.values(GLYPH[n])) g.dispose();
  GLYPH[n] = { mask, piece, pit };
}
}
buildGlyphs();

// ---- the clock ----
// The clock stays put while the floor slides back under it, one tile per second.
// Each new digit appears a few tiles back, slides forward and catches up to the clock.
// The digit it replaces lets go at that moment: it rides away with the floor and
// sinks into the hole that was under it, so the past reads like a ruler: 48 9 50 1 2 …
const tz = () => new Date().getTimezoneOffset() * 60;
const LANES = [
  { P: 3600, value: k => k % 24 },
  { P: 60, value: k => k % 60 },
  { P: 1, value: k => k % 60 },
];
const FLY = 0.45, FLY_DIST = 3.1 * TILE; // catch-up slide, speeding up as it lands
let LEAD = 0.31;                         // the old digit drops this long before the new one lands…
const DROP = 0.15;                       // …straight down, the moment its hole is right under it
let CLOCK_Z = 4.21;
let FLOOR_OFF = -0.0575;                      // tile seams relative to the holes
                    // where the clock sits on the floor
const Z_BACK = 12, Z_FRONT = 12;         // floor kept in the scene (world units)

const clock = new THREE.Group();
scene.add(clock);
LANES.forEach((L, i) => {
  L.x = [-0.4224, 0.5476, 1.4687][i] * TILE; // lane centres, fitted to the original
  L.tens = k => Math.floor(L.value(k) / 10);
  L.tensEnds = k => L.tens(k + 1) !== L.tens(k); // tens digit leaves with this value
  L.objs = new Map();
});

const flat = () => { const g = new THREE.Group(); g.rotation.x = -Math.PI / 2; return g; };

function makeHole(L, k) {
  const g = flat();
  const add = (d, x) => {
    const m = new THREE.Mesh(GLYPH[d].mask, MASK_MAT); m.renderOrder = -2; m.position.x = x;
    const p = new THREE.Mesh(GLYPH[d].pit, PIT_MAT); p.receiveShadow = p.castShadow = true; p.position.x = x;
    g.add(m, p);
  };
  add(L.value(k) % 10, PITCH / 2);
  if (L.tensEnds(k)) add(L.tens(k), -PITCH / 2);
  return g;
}

function makePiece(d, x) {
  const g = flat();
  const m = new THREE.Mesh(GLYPH[d].piece, PIECE_MAT.clone());
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  g.mat = m.material;
  g.off = x;
  g.seed = (d * 7.31 + x * 13.7) % 100;
  return g;
}

const ease3 = u => 1 - (1 - u) ** 3;
const smooth = u => u * u * (3 - 2 * u);
const bumps = (f, s) => 0.5 * Math.sin(f * 2.3 + s) + 0.3 * Math.sin(f * 5.1 + s * 1.7) + 0.2 * Math.sin(f * 11.3 + s * 2.9);
// where a digit is at time t: sliding in, riding with the clock, or let go and sinking
function pieceState(t, arrive, leave) {
  if (t < arrive - FLY) return null;
  if (t < arrive) {
    const u = (t - (arrive - FLY)) / FLY;
    return { z: CLOCK_Z - FLY_DIST * (1 - u * u), y: RAISE, op: Math.min(1, u * 1.6), wob: 1 };
  }
  const drop = leave - LEAD;
  if (t < drop) return { z: CLOCK_Z, y: RAISE, op: 1, wob: 1 };
  // its hole is right under it: fall straight in, then ride away with the floor
  const w = Math.min(1, (t - drop) / DROP);
  return { z: CLOCK_Z - (t - drop) * TILE, y: RAISE * (1 - w * w), op: 1, wob: 1 - w };
}

function updateLane(L, t, Fc) {
  const P = L.P, kc = Math.floor(t / P);
  const Fh = k => (k + 1) * P - 1 - LEAD; // floor spot of value k's hole: under the clock when k drops
  const want = new Map();
  const put = (key, make, z, y, op, wob = 0) => {
    let o = L.objs.get(key);
    if (!o) { o = make(); clock.add(o); L.objs.set(key, o); }
    o.position.set(L.x + (o.off || 0), y, z);
    if (o.mat) {
      o.mat.opacity = op; o.mat.transparent = op < 1;
      // rough floor: the digit rocks with the bumps passing under it
      const f = (Fc + (z - CLOCK_Z) / TILE) * 2.2, s = o.seed;
      const ax = 0.03 * wob * bumps(f, s), az = 0.03 * wob * bumps(f, s + 31), ay = 0.02 * wob * bumps(f * 0.7, s + 57);
      o.rotation.set(-Math.PI / 2 + ax, az, ay);
      o.position.y += wob * (0.004 * (bumps(f * 1.6, s + 83) + 1) + 0.25 * (Math.abs(ax) + Math.abs(az)));
    }
    want.set(key, o);
  };

  const kLo = Math.ceil((Fc - Z_BACK / TILE + 1 + LEAD) / P - 1);
  const kHi = Math.floor((Fc + Z_FRONT / TILE + 1 + LEAD) / P - 1);
  const ks = new Set();
  for (let k = kLo; k <= kHi; k++) {
    ks.add(k);
    put('h' + k, () => makeHole(L, k), CLOCK_Z + (Fh(k) - Fc) * TILE, 0, 1);
  }
  for (let k = kc - 1; k <= kc + 1; k++) ks.add(k);
  // the tens digit on show belongs to the last value of its run
  let end = kc; while (!L.tensEnds(end)) end++;
  ks.add(end); ks.add(end + 1);

  for (const k of ks) {
    const leave = (k + 1) * P;
    const s = pieceState(t, k * P, leave);
    if (s) put('o' + k, () => makePiece(L.value(k) % 10, PITCH / 2), s.z, s.y, s.op, s.wob);
    if (L.tensEnds(k)) {
      let start = k; while (!L.tensEnds(start - 1)) start--;
      const st = pieceState(t, start * P, leave);
      if (st) put('t' + k, () => makePiece(L.tens(k), -PITCH / 2), st.z, st.y, st.op, st.wob);
    }
  }
  for (const [key, o] of L.objs) {
    if (want.has(key)) continue;
    clock.remove(o); o.mat?.dispose(); L.objs.delete(key);
  }
}

// ---- camera (fitted to the original: long lens, slight roll) ----
// fitted by matching edge maps against frames of the original
const target = new THREE.Vector3(0.576, 0, 4.15);
let ROLL = -0.3265;
camera.position.set(-5.4855, 10.5945, 21.6485);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(target);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 12;
controls.maxDistance = 40;
controls.maxPolarAngle = 1.2;
controls.enabled = !STILL;
controls.update();
let lastTouch = -1e9;
controls.addEventListener('start', () => (lastTouch = performance.now()));
controls.addEventListener('end', () => (lastTouch = performance.now()));

let FOV = 7.4525;
function fitFov() {
  camera.aspect = innerWidth / innerHeight;
  // keep the whole readout on narrow screens
  camera.fov = camera.aspect < 1 ? FOV / Math.max(camera.aspect, 0.5) ** 0.85 : FOV;
  camera.updateProjectionMatrix();
}
fitFov();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitFov(); });

// ---- time ----
const realNow = () => Date.now() / 1000 - tz();   // local seconds since epoch
let offset = 0;
const at = params.get('at');
if (at) {
  const [h, m, s] = at.split(':').map(Number);
  const day = Math.floor(realNow() / 86400) * 86400;
  offset = day + h * 3600 + m * 60 + s - realNow();
}

function draw(t) {
  const Fc = t - 1; // floor spot under the clock, in seconds
  const fz = CLOCK_Z - LEAD + 0.5 * SEAM - Fc + FLOOR_OFF; // tile seams sit half a tile from each hole
  floor.position.z = fz - Math.floor(fz / (4 * SEAM)) * 4 * SEAM;
  for (const L of LANES) updateLane(L, t, Fc);
  sun.position.copy(target).add(new THREE.Vector3(-4, 12, 3));
  sun.target.position.copy(target);
  camera.rotateZ(ROLL);
  renderer.render(scene, camera);
  camera.rotateZ(-ROLL);
}

// for frame-by-frame checks: render one frame at a time of day, in seconds
let frozen = false;
window.clockAt = sod => {
  frozen = true;
  const day = Math.floor(realNow() / 86400) * 86400;
  draw(day + sod);
  return renderer.domElement;
};
window.setParams = p => {
  if (p.cam) camera.position.set(...p.cam);
  if (p.tgt) { target.set(...p.tgt); controls.target.copy(target); }
  if (p.fov) { FOV = p.fov; fitFov(); }
  if (p.roll != null) ROLL = p.roll;
  if (p.lanes) LANES.forEach((L, i) => (L.x = p.lanes[i]));
  if (p.clockZ != null) CLOCK_Z = p.clockZ;
  if (p.floorOff != null) FLOOR_OFF = p.floorOff;
  if (p.seam) setSeam(p.seam);
  if (p.lead != null) { LEAD = p.lead; for (const L of LANES) { for (const o of L.objs.values()) clock.remove(o); L.objs.clear(); } }
  if (p.cap || p.narrow || p.pitch) {
    if (p.cap) CAP = p.cap; if (p.narrow) NARROW = p.narrow; if (p.pitch) PITCH = p.pitch;
    buildGlyphs();
    for (const L of LANES) { for (const o of L.objs.values()) clock.remove(o); L.objs.clear(); }
  }
  camera.up.set(0, 1, 0); camera.lookAt(target);
};
window.__dbg = () => ({ pos: camera.position.toArray(), quat: camera.quaternion.toArray(), fov: camera.fov, aspect: camera.aspect, size: [renderer.domElement.width, renderer.domElement.height], CAP, NARROW, PITCH, ROLL });
setParams({}); // aim the camera now, not on the first animation frame
window.setCam = (pos, tgt, fov) => {
  target.set(...tgt); controls.target.copy(target);
  camera.position.set(...pos).add(target);
  if (fov) { FOV = fov; fitFov(); }
  camera.lookAt(target);
};

const swayBase = camera.position.clone().sub(target);
function frame(now) {
  requestAnimationFrame(frame);
  if (frozen) return;
  if (!STILL && !reduced && now - lastTouch > 4000) {
    const s = now / 1000;
    const want = swayBase.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(s * 0.07) * 0.18).add(target);
    want.y += Math.sin(s * 0.11) * 0.4;
    camera.position.lerp(want, 0.004);
  }
  controls.update();
  draw(realNow() + offset);
}
requestAnimationFrame(frame);
</script>

<script type="module">

const FONT = new Font({"cssFontWeight":"bold","ascender":1216,"underlinePosition":-100,"cssFontStyle":"normal","boundingBox":{"yMin":-333,"xMin":-162,"yMax":1216,"xMax":1681},"resolution":1000,"descender":-334,"familyName":"Helvetiker","lineHeight":1549,"underlineThickness":50,"glyphs":{"2":{"x_min":64,"x_max":764,"ha":828,"o":"m 764 685 q 675 452 764 541 q 484 325 637 415 q 307 168 357 250 l 754 168 l 754 0 l 64 0 q 193 301 64 175 q 433 480 202 311 q 564 673 564 576 q 519 780 564 737 q 416 824 475 824 q 318 780 358 824 q 262 633 270 730 l 80 633 q 184 903 80 807 q 415 988 276 988 q 654 907 552 988 q 764 685 764 819 "},"0":{"x_min":51,"x_max":779,"ha":828,"o":"m 415 -26 q 142 129 242 -26 q 51 476 51 271 q 141 825 51 683 q 415 984 242 984 q 687 825 585 984 q 779 476 779 682 q 688 131 779 271 q 415 -26 587 -26 m 415 137 q 529 242 485 137 q 568 477 568 338 q 530 713 568 619 q 415 821 488 821 q 303 718 344 821 q 262 477 262 616 q 301 237 262 337 q 415 137 341 137 "},"8":{"x_min":57,"x_max":770,"ha":828,"o":"m 625 516 q 733 416 697 477 q 770 284 770 355 q 675 69 770 161 q 415 -29 574 -29 q 145 65 244 -29 q 57 273 57 150 q 93 413 57 350 q 204 516 130 477 q 112 609 142 556 q 83 718 83 662 q 177 905 83 824 q 414 986 272 986 q 650 904 555 986 q 745 715 745 822 q 716 608 745 658 q 625 516 688 558 m 414 590 q 516 624 479 590 q 553 706 553 659 q 516 791 553 755 q 414 828 480 828 q 311 792 348 828 q 275 706 275 757 q 310 624 275 658 q 414 590 345 590 m 413 135 q 527 179 487 135 q 564 279 564 218 q 525 386 564 341 q 411 436 482 436 q 298 387 341 436 q 261 282 261 344 q 300 178 261 222 q 413 135 340 135 "},"5":{"x_min":59,"x_max":767,"ha":828,"o":"m 767 319 q 644 59 767 158 q 382 -29 533 -29 q 158 43 247 -29 q 59 264 59 123 l 252 264 q 295 165 252 201 q 400 129 339 129 q 512 172 466 129 q 564 308 564 220 q 514 437 564 387 q 398 488 464 488 q 329 472 361 488 q 271 420 297 456 l 93 428 l 157 958 l 722 958 l 722 790 l 295 790 l 271 593 q 348 635 306 621 q 431 649 389 649 q 663 551 56 75 370 l 775 213 m 474 364 l 474 786 l 204 363 l 474 364 "}}});

// ---- sizes (world units) ----
const PITCH = 0.74;     // digit spacing inside a unit
const GAP = 0.55;       // extra space between hh / mm / ss
const STEP = 1.2;       // spacing along a strip
const RAISE = 0.36;     // current digit height above floor
const PIT = 0.42;       // depth of the holes
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- renderer / scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#bdb6a8');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 16, 42);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xfffaf0, 0x7d766a, 1.35));
const sun = new THREE.DirectionalLight(0xfff6e8, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun, sun.target);

// ---- concrete floor ----
function concreteTexture() {
  const N = 1024, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = '#c3bcae'; g.fillRect(0, 0, N, N);
  // soft blotches, drawn wrapped so the tile repeats cleanly
  const blot = (x, y, r, a, col) => {
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    }
  };
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 40; i++) blot(rnd() * N, rnd() * N, 60 + rnd() * 220, 0.05 + rnd() * 0.12, rnd() < 0.7 ? '110,102,88' : '235,230,220');
  // speckle
  const img = g.getImageData(0, 0, N, N), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 22 + (rnd() < 0.004 ? -45 : 0);
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  // seams: 4x4 tiles per texture
  g.strokeStyle = 'rgba(70,64,54,.75)'; g.lineWidth = 2.2;
  for (let i = 0; i <= 4; i++) {
    const p = i * N / 4;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, N); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(N, p); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const floorTex = concreteTexture();
const FLOOR = 200, TILE = 2.6;
floorTex.repeat.set(FLOOR / (TILE * 4), FLOOR / (TILE * 4));
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(FLOOR, FLOOR),
  new THREE.MeshStandardMaterial({
    map: floorTex, roughness: 0.95,
    // floor is skipped wherever a hole mask wrote 1 into the stencil
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc,
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
floor.renderOrder = -1;
scene.add(floor);

// ---- digit geometry (cached per glyph) ----
const MASK_MAT = new THREE.MeshBasicMaterial({
  colorWrite: false, depthWrite: false, depthTest: false,
  stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
});
const PIECE_MAT = new THREE.MeshStandardMaterial({ color: 0xf6f4f0, roughness: 0.5 });
// open-topped pit: walls + floor, seen from inside
const PIT_MAT = [
  new THREE.MeshStandardMaterial({ color: 0xd8d2c6, roughness: 1, side: THREE.BackSide }),                                // bottom
  new THREE.MeshStandardMaterial({ color: 0xc2bbad, roughness: 1, side: THREE.BackSide, shadowSide: THREE.DoubleSide }), // walls
];

const capH = (() => { const b = new THREE.ShapeGeometry(FONT.generateShapes('0', 1)); b.computeBoundingBox(); return b.boundingBox.max.y; })();
const GLYPH = {};
for (let n = 0; n < 10; n++) {
  const ch = String(n);
  const shapes = FONT.generateShapes(ch, 1);
  const mask = new THREE.ShapeGeometry(shapes, 6);
  mask.computeBoundingBox();
  const cx = (mask.boundingBox.min.x + mask.boundingBox.max.x) / 2, cy = capH / 2;
  mask.translate(-cx, -cy, 0);

  const piece = new TextGeometry(ch, {
    font: FONT, size: 1, height: RAISE, depth: RAISE, curveSegments: 8,
    bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelOffset: -0.03, bevelSegments: 3,
  });
  piece.computeBoundingBox();
  piece.translate(-cx, -cy, -piece.boundingBox.max.z); // top face at z = 0

  const pit = new THREE.ExtrudeGeometry(shapes, { depth: PIT, bevelEnabled: false, curveSegments: 8 });
  pit.translate(-cx, -cy, -PIT);
  GLYPH[n] = { mask, piece, pit };
}

// ---- the clock ----
// The clock stays put while the floor slides back under it, one slot per second.
// Every value has a hole cut in the floor at the spot the clock will be over when
// that value ends. When a value ends, its digit drops into that hole and rides away
// with the floor; the next digit flies in from behind and catches up to the clock.
const tz = () => new Date().getTimezoneOffset() * 60;
const LANES = [
  { P: 3600, value: k => k % 24 },
  { P: 60, value: k => k % 60 },
  { P: 1, value: k => k % 60 },
];
const LANE_W = 2 * PITCH + GAP;
const FLY = 0.55, FLY_DIST = 3.6 * STEP;              // catch-up slide
const LEAD = 0.3, DROP = 0.4;                          // old digit drops just before the tick…
const BACK = 0.8;                                      // …into a hole that has slid most of a slot behind
const Z_BACK = 26, Z_FRONT = 14;                        // slots kept in the scene (world units)

const clock = new THREE.Group();
scene.add(clock);
LANES.forEach((L, i) => {
  L.x = (i - 1) * LANE_W;
  L.tens = k => Math.floor(L.value(k) / 10);
  L.tensEnds = k => L.tens(k + 1) !== L.tens(k); // tens digit leaves with this value
  L.objs = new Map();
});

const flat = () => { const g = new THREE.Group(); g.rotation.x = -Math.PI / 2; return g; };

function makeHole(L, k) {
  const g = flat();
  const add = (d, x) => {
    const m = new THREE.Mesh(GLYPH[d].mask, MASK_MAT); m.renderOrder = -2; m.position.x = x;
    const p = new THREE.Mesh(GLYPH[d].pit, PIT_MAT); p.receiveShadow = p.castShadow = true; p.position.x = x;
    g.add(m, p);
  };
  add(L.value(k) % 10, PITCH / 2);
  if (L.tensEnds(k)) add(L.tens(k), -PITCH / 2);
  return g;
}

function makePiece(d, x) {
  const g = flat();
  const m = new THREE.Mesh(GLYPH[d].piece, PIECE_MAT.clone());
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  g.mat = m.material;
  g.off = x;
  g.seed = Math.random() * 100;
  return g;
}

const ease3 = u => 1 - (1 - u) ** 3;
const bumps = (f, s) => 0.5 * Math.sin(f * 2.3 + s) + 0.3 * Math.sin(f * 5.1 + s * 1.7) + 0.2 * Math.sin(f * 11.3 + s * 2.9);
// where a digit is at time t: flying in, sitting in the clock, or dropped into its hole
function pieceState(t, Fc, arrive, dropAt, Fh) {
  if (t < arrive - FLY) return null;
  if (t < arrive) {
    const u = (t - (arrive - FLY)) / FLY;
    return { z: -FLY_DIST * (1 - ease3(u)), y: RAISE, op: Math.min(1, u * 2.5), wob: 1 };
  }
  if (t < dropAt) return { z: 0, y: RAISE, op: 1, wob: 1 };
  const w = Math.min(1, (t - dropAt) / DROP);
  return { z: (Fh - Fc) * STEP * (w * w * (3 - 2 * w)), y: RAISE * (1 - w * w), op: 1, wob: 1 - w };
}

function updateLane(L, t, Fc) {
  const P = L.P, kc = Math.floor(t / P);
  const Fh = k => (k + 1) * P - LEAD - 1 - BACK;    // floor spot of value k's hole
  const want = new Map();
  const put = (key, make, x, z, y, op, wob = 0) => {
    let o = L.objs.get(key);
    if (!o) { o = make(); clock.add(o); L.objs.set(key, o); }
    o.position.set(L.x + (o.off || 0), y, z);
    if (o.mat) {
      o.mat.opacity = op; o.mat.transparent = op < 1;
      // rough floor: the digit rocks with the bumps passing under it
      const f = (Fc + z / STEP) * 2.2, s = o.seed;
      const ax = 0.045 * wob * bumps(f, s), az = 0.045 * wob * bumps(f, s + 31), ay = 0.03 * wob * bumps(f * 0.7, s + 57);
      o.rotation.set(-Math.PI / 2 + ax, az, ay);
      o.position.y += wob * (0.008 * (bumps(f * 1.6, s + 83) + 1) + 0.35 * (Math.abs(ax) + Math.abs(az)));
    }
    want.set(key, o);
  };

  // holes (and the digits that fell into them) near the clock
  const kLo = Math.ceil((Fc - Z_BACK / STEP + LEAD + 1 + BACK) / P - 1);
  const kHi = Math.floor((Fc + Z_FRONT / STEP + LEAD + 1 + BACK) / P - 1);
  const ks = new Set();
  for (let k = kLo; k <= kHi; k++) {
    ks.add(k);
    put('h' + k, () => makeHole(L, k), 0, (Fh(k) - Fc) * STEP, 0, 1);
  }
  for (let k = kc - 1; k <= kc + 1; k++) ks.add(k);
  // the tens digit on show belongs to the last value of its run
  let end = kc; while (!L.tensEnds(end)) end++;
  ks.add(end); ks.add(end + 1);

  for (const k of ks) {
    const dropAt = (k + 1) * P - LEAD;
    const s = pieceState(t, Fc, k * P, dropAt, Fh(k));
    if (s) put('o' + k, () => makePiece(L.value(k) % 10, PITCH / 2), 0, s.z, s.y, s.op, s.wob);
    if (L.tensEnds(k)) {
      let start = k; while (!L.tensEnds(start - 1)) start--;
      const st = pieceState(t, Fc, start * P, dropAt, Fh(k));
      if (st) put('t' + k, () => makePiece(L.tens(k), -PITCH / 2), 0, st.z, st.y, st.op, st.wob);
    }
  }
  for (const [key, o] of L.objs) {
    if (want.has(key)) continue;
    clock.remove(o); o.mat?.dispose(); L.objs.delete(key);
  }
}

// ---- camera ----
const target = new THREE.Vector3(0.9, 0, -0.2);
camera.position.set(-3.1, 6.2, 5.0).add(target);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(target);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = 1.2;
controls.update();
let lastTouch = -1e9;
controls.addEventListener('start', () => (lastTouch = performance.now()));
controls.addEventListener('end', () => (lastTouch = performance.now()));

function fitFov() {
  camera.aspect = innerWidth / innerHeight;
  // keep the whole readout on narrow screens
  camera.fov = camera.aspect < 1 ? 32 / Math.max(camera.aspect, 0.5) ** 0.85 : 32;
  camera.updateProjectionMatrix();
}
fitFov();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitFov(); });

// ---- loop ----
const swayBase = camera.position.clone().sub(target);

function frame(now) {
  const t = Date.now() / 1000 - tz();
  const Fc = t - 1; // floor spot under the clock, in seconds
  floor.position.z = -((Fc * STEP) % (TILE * 4));
  for (const L of LANES) updateLane(L, t, Fc);

  // slow drift when nobody is dragging
  if (!reduced && now - lastTouch > 4000) {
    const t = now / 1000;
    const want = swayBase.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(t * 0.07) * 0.22).add(target);
    want.y += Math.sin(t * 0.11) * 0.5;
    camera.position.lerp(want, 0.004);
  }
  controls.update();

  sun.position.copy(target).add(new THREE.Vector3(-7, 11, -5));
  sun.target.position.copy(target);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

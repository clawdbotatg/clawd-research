{ const g = sc.getContext("2d");

  for (const x of [-60, 0, 60]) for (let k = 0; k < 8; k++) { const m = new THREE.Mesh(dash, WHT); m.scale.set(0.6, 0.3, 0.5); m.position.set(x, FLOOR + 0.5, -L / 2 + 50 + k * 100); g.add(m); }   // runway lights

  const ph = ((off + L / 4 + CAMZ + 200 - L / 2) % L + L) % L;          // arch z relative to tile, as seen at z=0

const FW_LIFE = 1.7;

  const P = fw.geometry.attributes.position.array, C = fw.geometry.attributes.color.array;

      gl_FragColor=vec4(oetf(knee(c.r)),oetf(knee(c.g)),oetf(knee(c.b)),1.); }`,

// ---- the move: two 3 s halves; each = whip in, hold in your face, rip back flipping, hang ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (x) => x * x * (3 - 2 * x);
const BACK = -60, NEAR = 108;
const IN = 0.30, HOLD = 1.55, OUT = 2.05;      // within each 3 s half
function whipIn(u) {                            // fast start, overshoots past NEAR, springs back

}
function poseAt(t) {

  let z, rx = 0, ry = 0, rz = 0, x = 0, y = 0, scr = 1.4, flash = 0, press = 0, shake = 0, near = 0;
  let pic = half === 0 ? undies : sign;
